# Quick Test Configuration - Fast experiment for testing

# System Configuration
system:
  name: lorenz
  stochastic: true
  num_timepoints: 50      # Reduced for faster testing
  t0: 0.0
  t1: 10.0                # Shorter time range
  
# Data Configuration  
data:
  history_size: 20        # Smaller for speed
  prediction_size: 10     # Smaller for speed
  n_train_test_samples: 64   # Much smaller dataset
  batch_size: 16          # Smaller batches

# Model Architecture
model:
  covariates_dim: 1
  hidden_dim: 32          # Smaller model
  time_dim: 8             # Smaller embedding
  hidden_blocks: 2        # Fewer blocks
  rnn_hidden: 32          # Smaller RNN
  n_rnn_layers: 2         # Fewer layers

# Training Configuration
training:
  learning_rate: 0.01     # Higher LR for faster convergence
  num_epochs: 10          # Very few epochs for testing

# Flow Matching Configuration  
flow:
  n_samples: 10           # Fewer samples
  n_steps_flow: 10        # Fewer steps
  nfe: 10                 # Fewer evaluations

# Experiment Configuration
experiment:
  name: "quick_test"
  wandb_project: "flowtime_test"
  save_figures: true
  results_dir: "test_results"
  seed: 42
  num_eval_samples: 10