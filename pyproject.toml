[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afm"
version = "0.1.0"
description = "Autoregressive Flow Matching for dynamical systems forecasting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ahmed Elgazzar" },
]
keywords = ["flow-matching", "time-series", "dynamical-systems", "jax", "autoregressive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "flax>=0.8",
    "diffrax>=0.5",
    "optax>=0.2",
    "jax-dataloader>=0.1",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "tqdm>=4.65",
    "wandb>=0.15",
]

[project.scripts]
afm = "afm.cli:main"

[project.urls]
Repository = "https://github.com/aelgazzar/afm"

[tool.hatch.build.targets.wheel]
packages = ["src/afm"]
