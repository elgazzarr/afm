# AFM vs FM Comparison on Single Dynamical System
# Complete end-to-end experiment comparing Autoregressive Flow Matching vs Flow Matching

experiment:
  type: "afm_vs_fm_single_system"
  name: "AFM vs FM - Lorenz System"
  description: "Compare AFM and FM performance on single dynamical system"
  
  # Output configuration
  plots:
    - "trajectory_predictions"      # Sample trajectory plots for both models
    - "metrics_comparison"          # Bar chart comparing CRPS/NRMSE
    - "uncertainty_quantification"  # Uncertainty bands visualization
  
  results:
    save_models: true              # Save trained model weights
    save_predictions: true         # Save sample predictions
    metrics_file: "afm_vs_fm_single_results.json"
    figures_dir: "afm_vs_fm_single"

# System Configuration
system:
  name: lorenz                     # Can be: lorenz, vanderpol, lotka_volterra, etc.
  stochastic: true                 # Whether to use stochastic version
  num_timepoints: 100              # Length of trajectories
  t0: 0.0                         # Start time
  t1: 20.0                        # End time
  
# Data Configuration  
data:
  history_size: 50                # Points for conditioning
  prediction_size: 30             # Points to predict
  n_train_test_samples: 1024      # Number of trajectories for training
  batch_size: 128                 # Training batch size

# Model Architecture (shared between AFM and FM)
model:
  covariates_dim: 1               # Input dimension
  hidden_dim: 64                  # Hidden layer size
  time_dim: 16                    # Time embedding dimension
  hidden_blocks: 3                # Number of flow blocks
  rnn_hidden: 64                  # RNN hidden size
  n_rnn_layers: 3                 # Number of RNN layers

# Training Configuration
training:
  learning_rate: 0.001            # Learning rate
  num_epochs_afm: 200             # Epochs for AFM training
  num_epochs_fm: 400              # Epochs for FM training (typically needs more)
  early_stopping: true            # Use early stopping
  patience: 20                    # Early stopping patience

# Flow Matching Configuration  
flow:
  n_samples: 50                   # Samples for uncertainty quantification
  n_steps_flow: 50                # NFE for sampling
  nfe: 20                         # Alternative NFE parameter

# Evaluation Configuration
evaluation:
  n_eval_samples: 100             # Samples for evaluation
  test_batch_size: 64             # Batch size for evaluation
  metrics:
    - "crps_prediction"           # Continuous Ranked Probability Score
    - "nrmse_prediction"          # Normalized Root Mean Square Error
    - "crps_extrapolation"        # CRPS for extrapolation
    - "nrmse_extrapolation"       # NRMSE for extrapolation

# Experiment Configuration
experiment_settings:
  wandb_project: "flowtime_single_system"
  seed: 42                        # Random seed for reproducibility
  verbose: true                   # Print detailed progress
  save_figures: true              # Save result plots
  figure_format: "pdf"            # Figure format (pdf, png, etc.)