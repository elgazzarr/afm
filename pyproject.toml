[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afm"
version = "0.1.0"
description = "Autoregressive Flow Matching for dynamical systems forecasting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ahmed Elgazzar" },
]
keywords = ["flow-matching", "time-series", "dynamical-systems", "jax", "autoregressive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # jax>=0.8.2 removed the `abstracted_axes` argument that flax 0.10.x's
    # nnx.jit passes to jax.jit, so it must stay below that.
    "jax>=0.4.27,<0.8.2",
    "jaxlib>=0.4.27,<0.8.2",
    # flax 0.11 made nnx.Optimizer's `wrt` required and changed update() to
    # update(model, grads); the trainers use the 0.10.x API.
    "flax>=0.10,<0.11",
    "diffrax>=0.5",
    # lineax>=0.1 (a transitive diffrax dep) requires jax>=0.10, conflicting
    # with the jax cap above.
    "lineax<0.1",
    "optax>=0.2",
    "jax-dataloader>=0.1",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "tqdm>=4.65",
    "wandb>=0.15",
    "scipy>=1.10",
    "requests>=2.28",
]

[project.scripts]
afm = "afm.cli:main"

[project.urls]
Repository = "https://github.com/aelgazzar/afm"

[tool.hatch.build.targets.wheel]
packages = ["src/afm"]
