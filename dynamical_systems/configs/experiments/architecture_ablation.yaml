# Architecture Ablation Study
# Studies the effect of different architectural choices on performance

experiment:
  type: "architecture_ablation"
  name: "Architecture Ablation Study - Lorenz"
  description: "Study the effect of model architecture on AFM vs FM performance"
  
  # Architecture parameters to sweep
  sweep_params:
    hidden_dim: [32, 64, 96, 128]              # Hidden layer dimensions
    hidden_blocks: [2, 3, 4, 5]               # Number of flow blocks
    n_rnn_layers: [2, 3, 4]                   # Number of RNN layers
    rnn_hidden: [32, 64, 96]                  # RNN hidden dimensions
    
  # Specific architectures to test
  architectures:
    - name: "small"
      hidden_dim: 32
      hidden_blocks: 2  
      n_rnn_layers: 2
      rnn_hidden: 32
    - name: "medium"
      hidden_dim: 64
      hidden_blocks: 3
      n_rnn_layers: 3
      rnn_hidden: 64
    - name: "large"
      hidden_dim: 128
      hidden_blocks: 4
      n_rnn_layers: 4
      rnn_hidden: 128
    - name: "deep_narrow"
      hidden_dim: 48
      hidden_blocks: 6
      n_rnn_layers: 5
      rnn_hidden: 48
    - name: "shallow_wide"
      hidden_dim: 128
      hidden_blocks: 2
      n_rnn_layers: 2
      rnn_hidden: 128

  # Output configuration
  plots:
    - "architecture_performance_heatmap"   # Performance vs architecture params
    - "model_size_vs_accuracy"             # Model size vs accuracy tradeoff
    - "parameter_sensitivity"              # Sensitivity to each parameter
    - "architecture_comparison"            # Compare specific architectures
    - "training_efficiency"                # Training time vs performance
  
  results:
    save_architecture_analysis: true      # Save detailed architecture analysis
    save_parameter_counts: true           # Save parameter counts for each model
    metrics_file: "architecture_ablation_results.json"
    figures_dir: "architecture_ablation"
    architecture_summary: "architecture_comparison.csv"

# Fixed System Configuration
system:
  name: lorenz                     # Fixed system for controlled comparison
  stochastic: true
  num_timepoints: 100
  t0: 0.0
  t1: 2.0
  
# Fixed Data Configuration
data:
  history_size: 50
  prediction_size: 30
  n_train_test_samples: 512        # Medium dataset for balanced training
  batch_size: 64

# Base Model Architecture (overridden in sweep)
model:
  covariates_dim: 1               # Fixed
  time_dim: 16                    # Fixed for simplicity
  # hidden_dim, hidden_blocks, n_rnn_layers, rnn_hidden vary

# Training Configuration
training:
  learning_rate: 0.001
  num_epochs_afm: 200
  num_epochs_fm: 400
  early_stopping: true
  patience: 25                    # More patience for larger models

# Flow Configuration
flow:
  n_samples: 40
  nfe: 40
  nfe: 20

# Evaluation Configuration  
evaluation:
  n_eval_samples: 60
  test_batch_size: 32
  metrics:
    - "crps_prediction"
    - "nrmse_prediction"
    - "crps_extrapolation"
    - "nrmse_extrapolation"
    - "parameter_count"             # Number of model parameters
    - "training_time"               # Time to train
    - "inference_time"              # Time per inference

# Experiment Settings
experiment_settings:
  wandb_project: "flowtime_architecture_study"
  seed: 654
  verbose: true
  save_figures: true
  figure_format: "pdf"
  
  # Architecture analysis settings
  measure_flops: true             # Measure FLOPs if possible
  memory_profiling: true          # Profile memory usage
  gradient_analysis: true         # Analyze gradient flow
  
  # Efficiency analysis
  pareto_analysis: true           # Find Pareto optimal architectures
  efficiency_ranking: true        # Rank architectures by efficiency
  
  # Statistical analysis
  architecture_significance: true # Test statistical significance
  parameter_importance: true      # Analyze parameter importance