# High Quality Configuration - Best performance settings

# System Configuration
system:
  name: lorenz
  stochastic: true
  num_timepoints: 200     # Long trajectories
  t0: 0.0
  t1: 40.0                # Extended time range
  
# Data Configuration  
data:
  history_size: 100       # Long history
  prediction_size: 50     # Long predictions
  n_train_test_samples: 2048  # Large dataset
  batch_size: 64          # Good batch size

# Model Architecture
model:
  covariates_dim: 1
  hidden_dim: 128         # Large model
  time_dim: 32            # Rich time embedding
  hidden_blocks: 5        # Many blocks for expressiveness
  rnn_hidden: 128         # Large RNN
  n_rnn_layers: 4         # Deep RNN

# Training Configuration
training:
  learning_rate: 0.0005   # Conservative learning rate
  num_epochs: 500         # Many epochs

# Flow Matching Configuration  
flow:
  n_samples: 100          # Many samples for uncertainty
  n_steps_flow: 100       # High fidelity sampling
  nfe: 50                 # Many evaluations

# Experiment Configuration
experiment:
  name: "high_quality_lorenz"
  wandb_project: "flowtime_ds"
  save_figures: true
  results_dir: "results"
  seed: 0
  num_eval_samples: 100