# W&B Sweep Configuration for History Length Optimization
# Usage: wandb sweep configs/sweeps/history_length_sweep.yaml
#        wandb agent <sweep_id>

program: main.py
project: flowtime_history_sweep
entity: your-wandb-entity  # Replace with your W&B username/team

# Sweep configuration
method: bayes  # bayes, grid, or random
metric:
  name: AFM/crps_prediction
  goal: minimize

# Hyperparameters to sweep
parameters:
  config:
    # Base configuration file - this remains fixed
    value: configs/experiments/afm_vs_fm_single_system.yaml
  
  # Override specific parameters for sweep
  data_history_size:
    values: [10, 20, 30, 40, 50, 60, 70, 80]
    
  training_learning_rate:
    distribution: log_uniform
    min: 0.0001
    max: 0.01
    
  flow_nfe:
    values: [10, 15, 20, 25, 30]
    
  model_hidden_dim:
    values: [32, 64, 96, 128]

# Early termination to save compute
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

# Resource limits
command:
  - python
  - -m
  - dynamical_systems.main
  - --config
  - ${config}
  - --sweep  # This flag tells the main script it's running in sweep mode