# AFM vs FM Comparison Across All Dynamical Systems
# Comprehensive comparison across all available dynamical systems

experiment:
  type: "afm_vs_fm_all_systems"
  name: "AFM vs FM - All Systems Comparison"
  description: "Compare AFM and FM performance across all dynamical systems"

  # Systems to test
  systems:
    - name: lorenz
      stochastic: true
    - name: lorenz
      stochastic: false
    - name: vanderpol
      stochastic: true
    - name: vanderpol
      stochastic: false
    - name: lotka_volterra
      stochastic: true
    - name: harmonic_oscillator
      stochastic: false
    - name: fitzhugh_nagumo
      stochastic: true
    - name: brusselator
      stochastic: true
    - name: duffing
      stochastic: false

  # Output configuration
  plots:
    - "systems_comparison_heatmap"   # Heatmap of performance across systems
    - "ranking_comparison"           # Ranking AFM vs FM for each system
    - "best_trajectories_grid"       # Grid of best predictions for each system
    - "statistical_significance"     # Statistical significance tests
    - "performance_radar"            # Radar chart of performance dimensions

  results:
    save_all_models: false          # Don't save all models (too much space)
    save_best_predictions: true     # Save best predictions for each system
    metrics_file: "all_systems_comparison.json"
    figures_dir: "all_systems_comparison"
    summary_table: "systems_summary.csv"

# System Configuration (base settings, overridden per system)
system:
  num_timepoints: 100
  t0: 0.0
  t1: 2.0

# Data Configuration
data:
  history_size: 50                 # Legacy parameter
  prediction_size: 30              # Legacy parameter
  n_train_test_samples: 512        # Smaller for multiple systems
  batch_size: 64

  # Infinite dataloader parameters
  context_length: 50
  afm_prediction_horizon: 1
  fm_prediction_horizon: 30
  steps_per_epoch: 150

# Model Architecture
model:
  covariates_dim: 1
  hidden_dim: 64
  time_dim: 16
  hidden_blocks: 3
  rnn_hidden: 64
  n_rnn_layers: 3

# Training Configuration
training:
  learning_rate: 0.001
  num_epochs: 150                 # Number of training epochs
  early_stopping: true
  patience: 20

# Flow Configuration
flow:
  n_samples: 40
  nfe: 20

# Evaluation Configuration
evaluation:
  n_eval_samples: 80
  test_batch_size: 32
  metrics:
    - "crps_prediction"
    - "nrmse_prediction"
    - "crps_extrapolation"
    - "nrmse_extrapolation"

# Experiment Settings
experiment_settings:
  wandb_project: "flowtime_all_systems"
  seed: 456
  verbose: true
  save_figures: true
  figure_format: "pdf"

  # Analysis settings
  statistical_tests: true          # Perform statistical comparisons
  system_ranking: true             # Rank systems by difficulty
  cross_system_analysis: true      # Analyze patterns across systems

  # Parallel execution
  parallel_systems: false          # Run systems in parallel (if resources allow)
