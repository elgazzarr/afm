# History Length Sensitivity Study
# Studies how history length affects prediction performance

experiment:
  type: "history_length_sensitivity"
  name: "History Length Sensitivity - Lorenz"
  description: "Study how history length affects AFM vs FM prediction accuracy"
  
  # Sweep parameters
  sweep_params:
    history_size: [10, 20, 30, 40, 50, 60, 70, 80]  # Different history lengths to test
  
  # Output configuration  
  plots:
    - "history_vs_accuracy"         # History length vs accuracy plot
    - "history_vs_crps"            # History length vs CRPS plot
    - "optimal_history_comparison"  # Comparison at optimal history length
    - "training_curves"            # Training curves for different history lengths
  
  results:
    save_sweep_results: true       # Save all sweep results
    metrics_file: "history_sensitivity_results.json"
    figures_dir: "history_sensitivity"

# Fixed System Configuration
system:
  name: lorenz                     # Fixed system for this study
  stochastic: true
  num_timepoints: 120              # Longer to accommodate max history + prediction
  t0: 0.0
  t1: 24.0
  
# Fixed Data Configuration  
data:
  # history_size varies in sweep - computed automatically
  prediction_size: 25              # Fixed prediction length
  n_train_test_samples: 512        # Smaller dataset for faster sweeps
  batch_size: 64

# Fixed Model Architecture
model:
  covariates_dim: 1
  hidden_dim: 64
  time_dim: 16  
  hidden_blocks: 3
  rnn_hidden: 64
  n_rnn_layers: 3

# Training Configuration
training:
  learning_rate: 0.001
  num_epochs_afm: 150              # Fewer epochs for sweep
  num_epochs_fm: 300
  early_stopping: true
  patience: 15

# Flow Configuration
flow:
  n_samples: 30                    # Fewer samples for faster evaluation
  n_steps_flow: 30
  nfe: 15

# Evaluation Configuration
evaluation:
  n_eval_samples: 50
  test_batch_size: 32
  metrics:
    - "crps_prediction"
    - "nrmse_prediction"
    - "crps_extrapolation" 
    - "nrmse_extrapolation"

# Experiment Settings
experiment_settings:
  wandb_project: "flowtime_history_study"
  seed: 123
  verbose: true
  save_figures: true
  figure_format: "pdf"
  
  # Analysis settings
  find_optimal_history: true       # Find optimal history length
  statistical_testing: true       # Perform significance tests