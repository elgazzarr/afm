# Base configuration for flow matching experiments
defaults:
  - _self_
  - experiment: electricity

# Training parameters
training:
  seed: 1
  batch_size: 64
  num_steps: 2000
  learning_rate: 3e-4
  val_interval: 200
  patience: 10

# Model architecture 
model:
  h_dim: 64
  t_dim: 32
  n_rnn_layers: 2
  rnn_hidden: 64
  n_residual_blocks: 8
  residual_channels: 8
  residual_hidden: 64

#Inference parameters
inference:
  mcmc_samples: 50 
  nfe: 50


# Logging
logging:
  wandb:
    project: "flowtime"
    log_interval: 200
  save_model: false
